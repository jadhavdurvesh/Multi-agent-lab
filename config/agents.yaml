# Agent → provider fallback chain.
# Groq is first: responses in 1-3 seconds, high free-tier daily quota.
# Gemini is fallback: slower (5-30s) but larger context window.
# Per-request timeout is 20s — if a provider hangs, it fails fast.
#
# Free tier limits (approximate, check provider docs):
#   Groq:     14,400 req/day, 30 req/min per model
#   Gemini:   1,500 req/day per key (we have 2 keys = 3,000/day)
#   Cerebras: ~1,000 req/day
#
# To add GEMINI_API_KEY_2: get a second key from aistudio.google.com
# with a different Google account and add it to repo secrets.

agents:
  architect:
    providers:
      - provider: groq
        base_url: https://api.groq.com/openai/v1
        api_key_env: GROQ_API_KEY
        model: llama-3.3-70b-versatile
      - provider: gemini
        base_url: https://generativelanguage.googleapis.com/v1beta/openai
        api_key_env: GEMINI_API_KEY
        model: gemini-2.0-flash
      - provider: gemini_2
        base_url: https://generativelanguage.googleapis.com/v1beta/openai
        api_key_env: GEMINI_API_KEY_2
        model: gemini-2.0-flash
      - provider: cerebras
        base_url: https://api.cerebras.ai/v1
        api_key_env: CEREBRAS_API_KEY
        model: llama-3.3-70b

  planner:
