# Agent → provider fallback chain.
#
# ⚠️  Model names expire — always verify at provider docs before relying on them:
#   Groq:      console.groq.com/docs/models
#   Gemini:    ai.google.dev/gemini-api/docs/models
#   NVIDIA:    build.nvidia.com/models
#   OpenRouter: openrouter.ai/models (filter: Free)
#
# Last verified: 2026-08-23
# Changes from previous config:
#   Groq:   llama-3.1-8b-instant + llama-3.3-70b-versatile DISCONTINUED 2026-06-17
#           → openai/gpt-oss-20b (small/fast) + openai/gpt-oss-120b (large)
#   Gemini: gemini-2.0-flash DISCONTINUED 2026-06-01
#           → gemini-3.7-flash
#   NVIDIA: meta/llama-3.3-70b-instruct times out consistently → use 8b only
#   Added:  OpenRouter as last-resort fallback (OPENROUTER_API_KEY already set)

agents:
  architect:
    providers:
      - provider: groq
        base_url: https://api.groq.com/openai/v1
        api_key_env: GROQ_API_KEY
        model: openai/gpt-oss-120b
      - provider: nvidia
        base_url: https://integrate.api.nvidia.com/v1
        api_key_env: NVIDIA_API_KEY
        model: meta/llama-3.1-8b-instruct
      - provider: gemini
        base_url: https://generativelanguage.googleapis.com/v1beta/openai
        api_key_env: GEMINI_API_KEY
        model: gemini-3.7-flash
      - provider: gemini_2
        base_url: https://generativelanguage.googleapis.com/v1beta/openai
        api_key_env: GEMINI_API_KEY_2
        model: gemini-3.7-flash
      - provider: openrouter
        base_url: https://openrouter.ai/api/v1
        api_key_env: OPENROUTER_API_KEY
        model: meta-llama/llama-3.3-70b-instruct:free

  planner:
