name: Run multi-agent-lab (external repo)

# This workflow runs the agents from this repository
# against a DIFFERENT target/product repository.
#
# The target repository receives:
#   - agent branch
#   - commits
#   - pull request
#
# This repository acts as the controller.

on:
  workflow_dispatch:
    inputs:

      target_repo:
        description: "owner/repo of the product repo the agents will work on"
        required: false
        type: string
        default: "jadhavdurvesh/psychic-dollop"

      task:
        description: "What should the agents build/fix in that repo?"
        required: true
        type: string

      branch:
        description: "Branch the agents will work on"
        required: false
        type: string
        default: "agent/task"

      test_command:
        description: "Command the Tester agent runs in the target repo"
        required: false
        type: string
        default: "pytest -q"

      auto_merge:
        description: "Auto-merge the PR if CI checks pass (true/false)"
        required: false
        type: boolean
        default: false

  schedule:
    - cron: "*/20 * * * *"


# ============================================================
# ENVIRONMENT
# ============================================================

env:
  DEFAULT_TARGET_REPO: "jadhavdurvesh/psychic-dollop"


# ============================================================
# PERMISSIONS
# ============================================================

permissions:
  contents: read


# ============================================================
# CONCURRENCY
# ============================================================

concurrency:
  group: multi-agent-lab-external-${{ github.event.inputs.target_repo || 'jadhavdurvesh/psychic-dollop' }}
  cancel-in-progress: false  # rely on issue 'agent-task-running' label to skip concurrent triggers


# ============================================================
# JOBS
# ============================================================

jobs:

  run-agents:

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      # ======================================================
      # CHECKOUT CONTROLLER
      # ======================================================

      - name: Checkout controller
        uses: actions/checkout@v4


      # ======================================================
      # DERIVE TASK + TARGET REPOSITORY
      # ======================================================

      - name: Derive task + target repo
        id: derive-task
        uses: actions/github-script@v7

        env:
          TARGET_REPO_INPUT: ${{ inputs.target_repo }}
          TASK_INPUT: ${{ inputs.task }}
          BRANCH_INPUT: ${{ inputs.branch }}
          TEST_COMMAND_INPUT: ${{ inputs.test_command }}
          DEFAULT_TARGET_REPO: ${{ env.DEFAULT_TARGET_REPO }}

        with:

          github-token: ${{ secrets.TARGET_REPO_PAT }}

          script: |

            const targetRepo =
              process.env.TARGET_REPO_INPUT ||
              process.env.DEFAULT_TARGET_REPO;

            const branch =
              process.env.BRANCH_INPUT ||
              'agent/task';

            const testCommand =
              process.env.TEST_COMMAND_INPUT ||
              'pytest -q';

            const [targetOwner, targetName] =
              targetRepo.split('/');


            // --------------------------------------------------
            // Validate target repository
            // --------------------------------------------------

            if (!targetOwner || !targetName) {

              core.setFailed(
                `Invalid target repo '${targetRepo}'. Use owner/repo format.`
              );

              return;
            }


            // --------------------------------------------------
            // Store outputs
            // --------------------------------------------------

            core.setOutput(
              'target_repo',
              targetRepo
            );

            core.setOutput(
              'branch',
              branch
            );

            core.setOutput(
              'test_command',
              testCommand
            );


            // ==================================================
            // MANUAL WORKFLOW
            // ==================================================

            if (context.eventName === 'workflow_dispatch') {

              const task =
                (process.env.TASK_INPUT || '').trim();


              if (!task) {

                core.setFailed(
                  'Manual runs require a non-empty task input.'
                );

                return;
              }


              core.setOutput(
                'should_run',
                'true'
              );

              core.setOutput(
                'task',
                task
              );

              core.setOutput(
                'issue_number',
                ''
              );

              core.setOutput(
                'reason',
                'Manual task provided.'
              );

              return;
            }


            // ==================================================
            // SCHEDULED MODE
            // ==================================================

            const queueLabel =
              'agent-task';

            const runningLabel =
              'agent-task-running';


            // --------------------------------------------------
            // Find open agent PRs
            // --------------------------------------------------

            const openPrs =
              await github.paginate(
                github.rest.pulls.list,
                {
                  owner: targetOwner,
                  repo: targetName,
                  state: 'open',
                  per_page: 100
                }
              );


            const hasActiveAgentPr =
              openPrs.some(
                (pr) =>
                  pr.head.ref.startsWith(`${branch}-`)
              );


            if (hasActiveAgentPr) {

              core.setOutput(
                'should_run',
                'false'
              );

              core.setOutput(
                'task',
                ''
              );

              core.setOutput(
                'issue_number',
                ''
              );

              core.setOutput(
                'reason',
                `Skipped: open agent PR already exists for prefix ${branch}- in ${targetRepo}.`
              );

              return;
            }


            // --------------------------------------------------
            // Find queued issues
            // --------------------------------------------------

            const queueIssues =
              await github.paginate(
                github.rest.issues.listForRepo,
                {
                  owner: targetOwner,
                  repo: targetName,
                  state: 'open',
                  labels: queueLabel,
                  sort: 'created',
                  direction: 'asc',
                  per_page: 100
                }
              );


            const nextIssue =
              queueIssues.find(
                (issue) => !issue.pull_request
              );


            if (!nextIssue) {

              core.setOutput(
                'should_run',
                'false'
              );

              core.setOutput(
                'task',
                ''
              );

              core.setOutput(
                'issue_number',
                ''
              );

              core.setOutput(
                'reason',
                `Skipped: no open issues labeled ${queueLabel} in ${targetRepo}.`
              );

              return;
            }


            // --------------------------------------------------
            // Extract task
            // --------------------------------------------------

            const task =
              (nextIssue.title || '').trim();


            if (!task) {

              core.setOutput(
                'should_run',
                'false'
              );

              core.setOutput(
                'task',
                ''
              );

              core.setOutput(
                'issue_number',
                ''
              );

              core.setOutput(
                'reason',
                `Skipped: issue #${nextIssue.number} has an empty title.`
              );

              return;
            }


            // --------------------------------------------------
            // Mark issue as running
            // --------------------------------------------------

            await github.rest.issues.addLabels({

              owner: targetOwner,

              repo: targetName,

              issue_number: nextIssue.number,

              labels: [
                runningLabel
              ]

            });


            // --------------------------------------------------
            // Remove queue label
            // --------------------------------------------------

            try {

              await github.rest.issues.removeLabel({

                owner: targetOwner,

                repo: targetName,

                issue_number: nextIssue.number,

                name: queueLabel

              });

            }

            catch (error) {

              if (error.status !== 404) {

                throw error;

              }

            }


            // --------------------------------------------------
            // Comment on issue
            // --------------------------------------------------

            await github.rest.issues.createComment({

              owner: targetOwner,

              repo: targetName,

              issue_number: nextIssue.number,

              body:
                `Picked up by scheduled workflow run #${context.runNumber} from ${context.repo.owner}/${context.repo.repo}.`

            });


            // --------------------------------------------------
            // Outputs
            // --------------------------------------------------

            core.setOutput(
              'should_run',
              'true'
            );

            core.setOutput(
              'task',
              task
            );

            core.setOutput(
              'issue_number',
              String(nextIssue.number)
            );

            core.setOutput(
              'reason',
              `Scheduled task picked from issue #${nextIssue.number} in ${targetRepo}.`
            );


      # ======================================================
      # SHOW SKIP REASON
      # ======================================================

      - name: Explain skip reason

        if: steps.derive-task.outputs.should_run != 'true'

        run: |
          echo "${{ steps.derive-task.outputs.reason }}"


      # ======================================================
      # NOTIFY: START
      # ======================================================

      - name: Notify start
        if: steps.derive-task.outputs.should_run == 'true'
        run: |
          python scripts/notify.py start \
            "${{ steps.derive-task.outputs.task }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}


      # ======================================================
      # CHECKOUT TARGET REPOSITORY
      # ======================================================

      - name: Checkout target repo

        if: steps.derive-task.outputs.should_run == 'true'

        uses: actions/checkout@v4

        with:

          repository: ${{ steps.derive-task.outputs.target_repo }}

          token: ${{ secrets.TARGET_REPO_PAT }}

          fetch-depth: 0

          path: target-repo


      # ======================================================
      # SETUP PYTHON
      # ======================================================

      - name: Set up Python

        if: steps.derive-task.outputs.should_run == 'true'

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"


      # ======================================================
      # INSTALL DEPENDENCIES
      # ======================================================

      - name: Install dependencies

        if: steps.derive-task.outputs.should_run == 'true'

        run: |

          pip install -r requirements.txt

          # Also install target-repo's requirements (if any) so the Tester
          # agent can run tests after the Developer adds new dependencies.
          # This re-runs after every Developer change via the agent loop.
          if [ -f target-repo/requirements.txt ]; then
            pip install -r target-repo/requirements.txt || true
          fi


      # ======================================================
      # CONFIGURE GIT
      # ======================================================

      - name: Configure git identity and push credentials for agent commits

        if: steps.derive-task.outputs.should_run == 'true'

        working-directory: target-repo

        run: |

          git config user.name "multi-agent-lab bot"

          git config user.email "actions@users.noreply.github.com"

          # Fail fast if TARGET_REPO_PAT is not set — otherwise git push
          # silently fails (403) and the run reports success with no branch.
          if [ -z "${{ secrets.TARGET_REPO_PAT }}" ]; then
            echo "ERROR: TARGET_REPO_PAT secret is not set."
            echo "Add the psychic-dollop PAT as a secret named TARGET_REPO_PAT"
            echo "in Multi-agent-lab → Settings → Secrets and variables → Actions."
            exit 1
          fi

          TARGET="${{ steps.derive-task.outputs.target_repo }}"
          git remote set-url origin "https://x-access-token:${{ secrets.TARGET_REPO_PAT }}@github.com/${TARGET}.git"

        env:
          TARGET_REPO_PAT: ${{ secrets.TARGET_REPO_PAT }}


      # ======================================================
      # RUN AGENTS
      # ======================================================

      - name: Run agents against target repo

        if: steps.derive-task.outputs.should_run == 'true'

        env:

          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}

          GH_TOKEN: ${{ secrets.TARGET_REPO_PAT }}


        run: |

          BRANCH="${{ steps.derive-task.outputs.branch }}-${{ github.run_number }}"


          python main.py \
            --repo "$GITHUB_WORKSPACE/target-repo" \
            --task "${{ steps.derive-task.outputs.task }}" \
            --branch "$BRANCH" \
            --test-command "${{ steps.derive-task.outputs.test_command }}" \
            --wall-time 1080 \
            --autonomous


      # ======================================================
      # MARK SCHEDULED TASK STATUS
      # ======================================================

      - name: Mark scheduled task status

        if: always() && steps.derive-task.outputs.issue_number != ''

        uses: actions/github-script@v7

        with:

          github-token: ${{ secrets.TARGET_REPO_PAT }}

          script: |

            const targetRepo =
              '${{ steps.derive-task.outputs.target_repo }}';

            const [targetOwner, targetName] =
              targetRepo.split('/');


            const issueNumber =
              Number(
                '${{ steps.derive-task.outputs.issue_number }}'
              );


            const queueLabel =
              'agent-task';

            const runningLabel =
              'agent-task-running';

            const doneLabel =
              'agent-task-done';


            const conclusion =
              '${{ job.status }}';


            // --------------------------------------------------
            // Remove running label
            // --------------------------------------------------

            try {

              await github.rest.issues.removeLabel({

                owner: targetOwner,

                repo: targetName,

                issue_number: issueNumber,

                name: runningLabel

              });

            }

            catch (error) {

              if (error.status !== 404) {

                throw error;

              }

            }


            // --------------------------------------------------
            // Successful task
            // --------------------------------------------------

            if (conclusion === 'success') {

              await github.rest.issues.addLabels({

                owner: targetOwner,

                repo: targetName,

                issue_number: issueNumber,

                labels: [
                  doneLabel
                ]

              });


              await github.rest.issues.createComment({

                owner: targetOwner,

                repo: targetName,

                issue_number: issueNumber,

                body:
                  `Completed by scheduled workflow run #${context.runNumber}.`

              });


              return;

            }


            // --------------------------------------------------
            // Failed task → requeue
            // --------------------------------------------------

            await github.rest.issues.addLabels({

              owner: targetOwner,

              repo: targetName,

              issue_number: issueNumber,

              labels: [
                queueLabel
              ]

            });


            await github.rest.issues.createComment({

              owner: targetOwner,

              repo: targetName,

              issue_number: issueNumber,

              body:
                `Run #${context.runNumber} ended with status: ${conclusion}. Re-queued for retry.`

            });


      # ======================================================
      # AUTO-MERGE PR IF CI PASSES
      # ======================================================

      - name: Auto-merge PR if CI passes
        if: >
          steps.derive-task.outputs.should_run == 'true' &&
          inputs.auto_merge == 'true' &&
          job.status == 'success'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TARGET_REPO_PAT }}
          script: |
            const targetRepo = '${{ steps.derive-task.outputs.target_repo }}';
            const [owner, repo] = targetRepo.split('/');
            const branch = '${{ steps.derive-task.outputs.branch }}-${{ github.run_number }}';

            const { data: prs } = await github.rest.pulls.list({
              owner, repo, state: 'open', per_page: 50
            });
            const pr = prs.find(p => p.head.ref === branch);
            if (!pr) { console.log('No open PR found for', branch); return; }

            // Poll CI checks for up to 10 minutes
            let merged = false;
            for (let i = 0; i < 20; i++) {
              const { data: checks } = await github.rest.checks.listForRef({
                owner, repo, ref: branch, per_page: 100
              });
              const runs = checks.check_runs || [];
              if (runs.length === 0) {
                // No CI configured — safe to merge immediately
                merged = true; break;
              }
              const allDone    = runs.every(r => r.status === 'completed');
              const allPassed  = runs.every(r => ['success','skipped','neutral'].includes(r.conclusion));
              if (allDone && allPassed) { merged = true; break; }
              if (allDone && !allPassed) { console.log('CI failed — not auto-merging.'); return; }
              console.log(`CI still running — waiting 30s (attempt ${i+1}/20)...`);
              await new Promise(r => setTimeout(r, 30000));
            }
            if (!merged) { console.log('CI timed out — not auto-merging.'); return; }

            await github.rest.pulls.merge({
              owner, repo,
              pull_number: pr.number,
              merge_method: 'squash',
              commit_title: `Agent: ${pr.title} (#${pr.number})`
            });
            console.log('Auto-merged PR #' + pr.number);


      # ======================================================
      # NOTIFY: PR OPENED or FAILED
      # ======================================================

      - name: Comment on originating issue with PR link
        if: steps.derive-task.outputs.should_run == 'true' && job.status == 'success'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TARGET_REPO_PAT }}
          script: |
            const targetRepo = '${{ steps.derive-task.outputs.target_repo }}';
            const [owner, repo] = targetRepo.split('/');
            const issueNum = parseInt('${{ steps.derive-task.outputs.issue_number }}', 10);
            const branch = '${{ steps.derive-task.outputs.branch }}-${{ github.run_number }}';

            if (!issueNum) { console.log('No issue number — skipping comment.'); return; }

            // Find the PR for this branch
            const { data: prs } = await github.rest.pulls.list({
              owner, repo, state: 'open', per_page: 50
            });
            const pr = prs.find(p => p.head.ref === branch);
            const prLink = pr ? pr.html_url : `(branch: ${branch})`;

            await github.rest.issues.createComment({
              owner, repo,
              issue_number: issueNum,
              body: `🤖 **multi-agent-lab** finished working on this task.\n\nPR: ${prLink}\n\n_Architect → Planner → Developer → Tester → Reviewer pipeline._`,
            });
            console.log(`Commented on issue #${issueNum}`);


      - name: Notify PR opened
        if: steps.derive-task.outputs.should_run == 'true' && job.status == 'success'
        run: |
          python scripts/notify.py pr \
            "${{ steps.derive-task.outputs.task }}" \
            "${{ github.server_url }}/${{ steps.derive-task.outputs.target_repo }}/pulls"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify run failed
        if: steps.derive-task.outputs.should_run == 'true' && job.status != 'success'
        run: |
          python scripts/notify.py fail \
            "${{ steps.derive-task.outputs.task }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}


      # ======================================================
      # UPLOAD LOGS
      # ======================================================

      - name: Upload run logs

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: agent-run-${{ github.run_number }}

          path: |

            usage.json

            target-repo/.agent/history/*.jsonl

          if-no-files-found: ignore
