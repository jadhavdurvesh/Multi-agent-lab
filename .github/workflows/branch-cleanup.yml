name: Clean up merged agent branches

# Runs every Sunday at 02:00 UTC and on manual dispatch.
# Deletes any branch matching agent/* or fix/* whose PR is merged or closed.
# Keeps main, and any branch with an open PR.

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Delete merged agent branches
        uses: actions/github-script@v7
        with:
          script: |
            const PROTECTED = new Set(['main', 'master', 'develop']);
            const PATTERN = /^(agent|fix|feat|docs)\//;

            const { data: branches } = await github.rest.repos.listBranches({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            let deleted = 0;
            let skipped = 0;

            for (const branch of branches) {
              const name = branch.name;
              if (PROTECTED.has(name) || !PATTERN.test(name)) continue;

              // Check if there's an open PR for this branch
              const { data: prs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: `${context.repo.owner}:${name}`,
                state: 'open',
              });

              if (prs.length > 0) {
                console.log(`Skipping '${name}' — has open PR #${prs[0].number}`);
                skipped++;
                continue;
              }

              // No open PR — delete the branch
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${name}`,
                });
                console.log(`Deleted: ${name}`);
                deleted++;
              } catch (e) {
                console.log(`Could not delete '${name}': ${e.message}`);
              }
            }

            console.log(`Done. Deleted: ${deleted}, skipped (open PR): ${skipped}.`);
